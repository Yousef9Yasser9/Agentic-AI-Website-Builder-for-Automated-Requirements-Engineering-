<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - Personal Notes App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f97316dd 0%,#f9731666 100%);padding:1rem;}
.card{border:0;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.2);width:min(460px,100%);}
.card-body{padding:2.5rem 2rem;}
.brand{font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:0.25rem;color:#f97316;}
.sub{text-align:center;color:var(--bs-secondary-color,#6c757d);margin-bottom:1.5rem;font-size:0.9rem;}
.form-floating>.form-control:focus{border-color:#f97316;}
.helper{font-size:0.8rem;color:#6c757d;margin-top:0.25rem;}
</style>
</head>
<body>
<div class="card"><div class="card-body">
<div class="brand">Personal Notes App</div><p class="sub">Create your account</p>
<form id="reg">
<div class="form-floating mb-3"><input id="name" class="form-control" type="text" placeholder="Full Name" required><label for="name"><i class="bi bi-person me-2"></i>Full Name</label></div>
<div class="form-floating mb-3"><input id="email" class="form-control" type="email" placeholder="name@example.com" required><label for="email"><i class="bi bi-envelope me-2"></i>Email Address</label></div>
<div class="form-floating mb-3"><input id="password" class="form-control" type="password" placeholder="Password" required><label for="password"><i class="bi bi-lock me-2"></i>Password</label></div>
<div class="helper mb-2"><i class="bi bi-info-circle me-1"></i>Min. 8 characters, use a strong password</div>
<div class="form-floating mb-3"><select id="role" class="form-select" required><option value="User" selected>User (Regular User)</option></select><label for="role"><i class="bi bi-person-badge me-2"></i>Account Type</label></div>
<button class="btn btn-primary w-100 py-2" type="submit"><i class="bi bi-person-plus me-2"></i>Create Account</button>
<p class="text-center mt-3 mb-0"><a href="/ui/login" class="text-decoration-none small">Already have an account? <strong>Sign in</strong></a></p>
</form>
</div></div>
<script>
const access_token = localStorage.getItem('access_token') || '';
async function apiFetch(path, opts={}) { return fetch(path, opts); }
document.getElementById('reg').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');const nameEl=document.getElementById('name');const emailEl=document.getElementById('email');const passwordEl=document.getElementById('password');const roleEl=document.getElementById('role');btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';try{const r=await apiFetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:nameEl.value,email:emailEl.value,password:passwordEl.value,role:roleEl.value||'User'})});let created={};try{created=await r.json();}catch(_){}if(!r.ok){alert(created.detail||'Account creation failed');btn.disabled=false;btn.innerHTML='<i class="bi bi-person-plus me-2"></i>Create Account';return}const login=await apiFetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailEl.value,password:passwordEl.value})});const tokenPayload=await login.json();if(!login.ok||!tokenPayload.access_token){alert('Account created. Please sign in.');location.href='/ui/login';return}localStorage.setItem('access_token',tokenPayload.access_token);const me=await apiFetch('/api/auth/me',{headers:{Authorization:'Bearer '+tokenPayload.access_token}});const userObj=me.ok?await me.json():{email:emailEl.value,role:'user'};localStorage.setItem('current_user',JSON.stringify(userObj));const role=(userObj.role||'').toLowerCase();location.href=role==='admin'?'/admin/dashboard':'/';}catch(ex){alert('Network error: '+ex.message);btn.disabled=false;btn.innerHTML='<i class="bi bi-person-plus me-2"></i>Create Account';}}</script>
</body></html>
