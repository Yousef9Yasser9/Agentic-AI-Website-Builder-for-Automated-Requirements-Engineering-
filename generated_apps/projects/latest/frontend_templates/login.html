<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Personal Notes App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f97316dd 0%,#f9731666 100%);padding:1rem;}
.card{border:0;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.2);width:min(420px,100%);}
.card-body{padding:2.5rem 2rem;}
.brand{font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:0.25rem;color:#f97316;}
.sub{text-align:center;color:var(--bs-secondary-color,#6c757d);margin-bottom:1.5rem;font-size:0.9rem;}
.form-floating>.form-control:focus{border-color:#f97316;}
.demo{font-size:0.8rem;background:#f8f9fa;border-radius:8px;padding:0.75rem;margin:1rem 0;}
</style>
</head>
<body>
<div class="card"><div class="card-body">
<div class="brand">Personal Notes App</div><p class="sub">Sign in to your account</p>
<form id="login">
<div class="form-floating mb-3"><input id="email" class="form-control" type="email" value="admin@example.com" placeholder="name@example.com" required><label for="email"><i class="bi bi-envelope me-2"></i>Email Address</label></div>
<div class="form-floating mb-3"><input id="password" class="form-control" type="password" value="Admin1234!" placeholder="Password" required><label for="password"><i class="bi bi-lock me-2"></i>Password</label></div>
<div class="demo"><strong><i class="bi bi-info-circle me-1"></i>Demo Credentials:</strong><br>
<span class="text-nowrap"><i class="bi bi-shield-check text-success me-1"></i>Admin:</span> admin@example.com / Admin1234!<br>
<span class="text-nowrap"><i class="bi bi-person text-primary me-1"></i>User:</span> user@example.com / User1234!</div>
<button class="btn btn-primary w-100 py-2" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
<p class="text-center mt-3 mb-0"><a href="/ui/register" class="text-decoration-none small">Don't have an account? <strong>Create one</strong></a></p>
</form>
</div></div>
<script>
const access_token = localStorage.getItem('access_token') || '';
async function apiFetch(path, opts={}) { return fetch(path, opts); }
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');const emailEl=document.getElementById('email');const passwordEl=document.getElementById('password');btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';try{const r=await apiFetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailEl.value,password:passwordEl.value})});const d=await r.json();if(!r.ok){alert(d.detail||'Login failed');btn.disabled=false;btn.innerHTML='<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';return}localStorage.setItem('access_token',d.access_token);const me=await apiFetch('/api/auth/me',{headers:{Authorization:'Bearer '+d.access_token}});const userObj=me.ok?await me.json():{email:emailEl.value,role:'user'};localStorage.setItem('current_user',JSON.stringify(userObj));const role=(userObj.role||'').toLowerCase();const landing=role==='admin'?'/admin/dashboard':'/';location.href=new URLSearchParams(location.search).get('next')||landing;}catch(ex){alert('Network error: '+ex.message);btn.disabled=false;btn.innerHTML='<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';}}</script>
</body></html>
